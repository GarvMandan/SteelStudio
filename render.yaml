services:
  - type: web
    name: steel-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: python visualizer.py --no-browser
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOST
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.5
    healthCheckPath: /api/health
